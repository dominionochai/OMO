<script>
  (function() {
    const display = document.getElementById('sentence-display');
    const clearBtn = document.getElementById('clear-btn');
    const speakBtn = document.getElementById('speak-btn');
    const tiles = document.querySelectorAll('.eye-tile');

    let currentText = "SLOWER PLEASE 🐢";

    function updateSentence(text) {
      currentText = text;
      if (text.trim().length === 0) {
        display.textContent = "I want to say: ...";
      } else {
        display.textContent = "I want to say: " + text;
      }
    }

    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        const phrase = tile.getAttribute('data-phrase');
        if (phrase) {
          updateSentence(phrase);
          speak(phrase);
        }
      });
    });

    clearBtn.addEventListener('click', () => {
      updateSentence("");
    });

    function speak(textToSpeak) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = textToSpeak.replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();
        if (cleanText) {
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }
      }
    }

    speakBtn.addEventListener('click', () => {
      if (currentText) {
        speak(currentText);
      }
    });
  })();
